name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/my-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/my-frontend:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/my-frontend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Write deploy script
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          cat > /tmp/deploy.sh << SCRIPT
          #!/usr/bin/env bash
          set -euo pipefail

          DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
          IMAGE_TAG="${IMAGE_TAG}"

          if [ -z "\${DOCKERHUB_USERNAME}" ] || [ -z "\${IMAGE_TAG}" ]; then
            echo "Error: DOCKERHUB_USERNAME or IMAGE_TAG is empty"
            exit 1
          fi

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "Error: neither 'docker compose' nor 'docker-compose' found"
            exit 1
          fi

          echo "Deploying \${DOCKERHUB_USERNAME}/my-frontend:\${IMAGE_TAG}"

          cd ~/learning_mandarin

          docker pull "\${DOCKERHUB_USERNAME}/my-frontend:\${IMAGE_TAG}"

          touch .env
          cp .env .env.bak
          TMP_ENV="\$(mktemp)"
          grep -vE '^(FRONTEND_IMAGE_TAG|DOCKERHUB_USERNAME)=' .env > "\$TMP_ENV" || true
          printf 'FRONTEND_IMAGE_TAG=%s\n' "\${IMAGE_TAG}" >> "\$TMP_ENV"
          printf 'DOCKERHUB_USERNAME=%s\n' "\${DOCKERHUB_USERNAME}" >> "\$TMP_ENV"
          mv "\$TMP_ENV" .env

          \$COMPOSE up -d --no-deps frontend

          sleep 5
          \$COMPOSE ps frontend

          if \$COMPOSE ps frontend | grep -qiE '\bexit(ed)?\b'; then
            echo "Error: frontend container failed to start"
            \$COMPOSE logs --tail=100 frontend
            exit 1
          fi

          echo "Deployment successful"
          SCRIPT
          chmod +x /tmp/deploy.sh

          grep -q 'DOCKERHUB_USERNAME=""' /tmp/deploy.sh && {
            echo "Error: DOCKERHUB_USERNAME did not interpolate"; exit 1; }
          grep -q 'IMAGE_TAG=""' /tmp/deploy.sh && {
            echo "Error: IMAGE_TAG did not interpolate"; exit 1; }
          true

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USERNAME: ${{ vars.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          scp -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            docker-compose.yml "$VPS_USERNAME@$VPS_HOST:~/learning_mandarin/docker-compose.yml"

          scp -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            /tmp/deploy.sh "$VPS_USERNAME@$VPS_HOST:/tmp/deploy.sh"

          ssh -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            "$VPS_USERNAME@$VPS_HOST" "bash --noprofile --norc /tmp/deploy.sh; rc=\$?; rm -f /tmp/deploy.sh; exit \$rc"

      - name: Cleanup
        if: always() 
        run: rm -f ~/.ssh/vps_key /tmp/deploy.sh

      - name: Deployment notification
        if: failure()
        run: echo "Deployment failed - check logs above"