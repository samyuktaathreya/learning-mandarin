services:
  backend:
    image: ${DOCKERHUB_USERNAME}/my-backend:${BACKEND_IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    restart: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/my-frontend:${FRONTEND_IMAGE_TAG:-latest}
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend