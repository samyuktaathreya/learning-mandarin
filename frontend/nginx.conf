# All HTTP → canonical HTTPS apex
server {
    listen 80;
    server_name wenku.app www.wenku.app;
    return 301 https://wenku.app$request_uri;
}

# www HTTPS → apex HTTPS
server {
    listen 443 ssl;
    server_name www.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    return 301 https://wenku.app$request_uri;
}

# Canonical host — serves the app
server {
    listen 443 ssl;
    server_name wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://clerk.wenku.app https://*.clerk.accounts.dev https://*.clerk.com; frame-src 'self' https://challenges.cloudflare.com https://clerk.wenku.app https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com https://api.wenku.app https://clerk.wenku.app https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline' https://clerk.wenku.app https://*.clerk.com; img-src 'self' data: blob: https://img.clerk.com https://*.clerk.com; media-src 'self' data: blob:; font-src 'self' data:; form-action 'self' https://clerk.wenku.app;" always;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}