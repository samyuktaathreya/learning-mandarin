server {
    listen 80;
    server_name wenku.app www.wenku.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wenku.app www.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}