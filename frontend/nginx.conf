server {
    listen 80;
    server_name wenku.app www.wenku.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wenku.app www.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com https://api.wenku.app; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}