# All HTTP → canonical HTTPS apex
server {
    listen 80;
    server_name wenku.app www.wenku.app;
    return 301 https://wenku.app$request_uri;
}

# www HTTPS → apex HTTPS
server {
    listen 443 ssl;
    server_name www.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    return 301 https://wenku.app$request_uri;
}

# Canonical host — serves the app
server {
    listen 443 ssl;
    server_name wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    root /usr/share/nginx/html;
    index index.html;

    # Define CSP policy directives across multiple lines
    set $csp_default "default-src 'self';";
    set $csp_script  "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://clerk.wenku.app https://*.clerk.accounts.dev https://*.clerk.com;";
    set $csp_frame   "frame-src 'self' https://challenges.cloudflare.com https://clerk.wenku.app https://*.clerk.accounts.dev https://*.clerk.com;";
    set $csp_worker  "worker-src 'self' blob:;";
    set $csp_connect "connect-src 'self' https://challenges.cloudflare.com https://api.wenku.app https://clerk.wenku.app https://*.clerk.accounts.dev https://*.clerk.com https://inputtools.google.com;";
    set $csp_style   "style-src 'self' 'unsafe-inline' https://clerk.wenku.app https://*.clerk.com;";
    set $csp_img     "img-src 'self' data: blob: https://img.clerk.com https://*.clerk.com;";
    set $csp_media   "media-src 'self' data: blob:;";
    set $csp_font    "font-src 'self' data:;";
    set $csp_form    "form-action 'self' https://clerk.wenku.app;";

    # Combine directives with spaces between them
    set $csp "${csp_default} ${csp_script} ${csp_frame} ${csp_worker} ${csp_connect} ${csp_style} ${csp_img} ${csp_media} ${csp_font} ${csp_form}";

    add_header Content-Security-Policy $csp always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.wenku.app;

    ssl_certificate /etc/nginx/certs/wenku.pem;
    ssl_certificate_key /etc/nginx/certs/wenku.key;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}